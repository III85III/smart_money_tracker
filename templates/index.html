<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>III85III | Executive Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #e5e7eb; }
        .lux-card { background: #111111; border: 1px solid #1f2937; }
    </style>
</head>
<body class="p-10">
    <header class="mb-12">
        <h1 class="text-4xl font-light text-white tracking-tighter italic">III85III <span class="text-gray-500">EXECUTIVE FEED</span></h1>
        <p class="text-gray-600 mt-2 tracking-widest text-xs uppercase">Institutional Grade Whale Intelligence</p>
    </header>

    <div id="feed" class="space-y-4"></div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const feed = document.getElementById('feed');
        ws.onmessage = (e) => {
            const s = JSON.parse(e.data);
            const entry = document.createElement('div');
            entry.className = "lux-card p-6 rounded-sm flex justify-between items-center transition-all hover:border-gray-500";
            entry.innerHTML = `
                <div class="flex-1">
                    <div class="text-xs text-gray-500 mb-1">${s.time} | CONFIDENCE: ${s.confidence}</div>
                    <div class="text-lg font-semibold text-gray-200">${s.name}</div>
                    <a href="${s.wallet_url}" target="_blank" class="text-gray-500 hover:text-cyan-400 text-xs">${s.wallet}</a>
                </div>
                <div class="text-right">
                    <div class="text-sm text-gray-500 uppercase font-bold">${s.action}</div>
                    <div class="text-2xl font-light tracking-tight text-white">${s.amount} ${s.token}</div>
                    <div class="text-emerald-500 font-bold">${s.usd}</div>
                </div>
            `;
            feed.prepend(entry);
            if(feed.children.length > 6) feed.removeChild(feed.lastChild);
        };
    </script>
</body>
</html>
